<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Impossible Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#ffffff;
  --surface:#f7f8fa;
  --line:#e4e7eb;
  --fg:#17191c;
  --muted:#5f6368;
  --red:#ec3750;
  --red-soft:#fff1f3;
  --on-red:#ffffff;
  --green:#15926a;
  --green-soft:#edfaf4;
  --radius:16px;
  --shadow:0 1px 2px rgba(23,25,28,.06), 0 8px 24px rgba(23,25,28,.07);
  --display:"Poppins",system-ui,sans-serif;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font:400 17px/1.6 var(--ui);
}
img{max-width:100%}
.sheet{max-width:660px; margin:0 auto; padding:40px 16px 72px}
.form,.inner{display:grid; gap:22px}

.masthead{display:grid; gap:6px; justify-items:center; text-align:center}
.agency{
  margin:0;
  font-size:.72rem;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--red);
}
h1{
  margin:0;
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(2rem,7vw,2.75rem);
  letter-spacing:-.025em;
  line-height:1.1;
}
.meta{margin:2px 0 0; font-family:var(--mono); font-size:.78rem; color:var(--muted)}
.deck{margin:0 auto; max-width:48ch; text-align:center; color:var(--muted)}

.field{
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow);
  padding:18px 22px 14px;
  display:grid;
  gap:8px;
}
.field p{margin:0}
.field:focus-within{border-color:var(--red)}
.field.burning{border-color:var(--red); animation:shake .4s linear infinite}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-2px)}
  75%{transform:translateX(2px)}
}
.field-head{
  margin:0;
  font-size:.7rem;
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
}
.field label{font-size:.9rem; color:var(--muted)}
textarea{
  display:block;
  width:100%;
  min-height:76px;
  resize:vertical;
  border:0;
  padding:0;
  background:transparent;
  color:var(--fg);
  font:500 1.05rem/1.6 var(--mono);
  word-break:break-word;
}
textarea:focus{outline:none}
.fieldnote{font-family:var(--mono); font-size:.75rem; color:var(--muted)}

.tally{display:grid; gap:8px}
.tallyhead{margin:0; font-size:.82rem; font-weight:500; color:var(--muted)}
.tallyhead #score{color:var(--fg)}
.bar{height:8px; background:var(--surface); border-radius:999px; overflow:hidden}
.bar i{display:block; height:100%; width:0; background:var(--red); border-radius:999px; transition:width .3s ease}
.bar.done i{background:var(--green)}
.status{margin:0; font-size:.95rem; color:var(--muted)}

.notices{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.rec{
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px 16px;
  display:grid;
  gap:8px;
}
.rec.open{border-color:var(--red); background:var(--red-soft); box-shadow:var(--shadow)}
.rec-head{margin:0; display:flex; align-items:center; gap:10px}
.code{font-family:var(--mono); font-size:.74rem; color:var(--muted)}
.flag{
  margin-left:auto;
  padding:3px 10px;
  border-radius:999px;
  font-size:.68rem;
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
}
.rec.open .flag{background:var(--red); color:var(--on-red)}
.rec.met .flag{background:var(--green-soft); color:var(--green)}
.rec-text{margin:0; font-size:.98rem}
.rec.met .rec-text{color:var(--muted)}
.rec-note{margin:0; font-family:var(--mono); font-size:.8rem; color:var(--muted)}
.rec-tray{display:grid; gap:10px; justify-items:start}

.meme{margin:0}
.meme img{
  display:block;
  width:104px;
  height:104px;
  object-fit:cover;
  border-radius:12px;
  box-shadow:var(--shadow);
  transform:rotate(-2deg);
}
.meme figcaption{margin-top:12px; font-size:.68rem; color:var(--muted)}
.meme figcaption::before{content:"Exhibit: "}
.moons{font-size:1.4rem; letter-spacing:.2em}
.captcha{
  display:inline-flex;
  gap:6px;
  padding:10px 16px;
  border-radius:12px;
  background:var(--surface);
  user-select:none;
}
.captcha span{display:inline-block; font:500 1.35rem var(--mono)}
button{
  font:500 .82rem var(--ui);
  padding:8px 16px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--bg);
  color:var(--fg);
  cursor:pointer;
}
button:hover{background:var(--surface); box-shadow:var(--shadow)}
button:focus-visible{outline:2px solid var(--red); outline-offset:2px}
.table{
  width:100%;
  max-height:160px;
  overflow:auto;
  padding:12px;
  border-radius:12px;
  background:var(--surface);
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(64px,1fr));
  gap:5px;
  font:.74rem var(--mono);
  color:var(--muted);
}
.table b{color:var(--fg); font-weight:500}

.win{
  border:1px solid var(--green);
  border-radius:var(--radius);
  background:var(--green-soft);
  padding:20px;
  display:grid;
  gap:12px;
  justify-items:start;
}
.win h2{margin:0; font-family:var(--display); font-size:1.3rem; color:var(--green)}
.win p{margin:0; color:var(--muted)}
.win .out{
  width:100%;
  padding:12px 14px;
  border-radius:12px;
  background:var(--bg);
  font:500 .88rem var(--mono);
  word-break:break-all;
}
.win button{background:var(--red); border-color:var(--red); color:var(--on-red)}
.win button:hover{background:var(--red); filter:brightness(1.08)}

.finefoot{
  margin:0;
  padding-top:18px;
  border-top:1px solid var(--line);
  text-align:center;
  font-size:.78rem;
  color:var(--muted);
}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
}
</style>
</head>
<body>
<main class="sheet">
<article class="form">

  <header class="masthead">
    <h1>Password Ragebait</h1>
    <p class="meta"><span id="clock">00:00</span>
    &middot; Edits <span id="edits">0</span></p>
  </header>

  <div class="inner">

    <p class="deck">A password game, made for class. Type anything to begin. Satisfy a clause and
    the next one unseals itself, and they stop being reasonable almost immediately.</p>

    <section class="field" id="field">
      <h2 class="field-head">Proposed credential</h2>
      <p><label for="pw">Make one up. Nothing you type is saved or sent anywhere.</label></p>
      <p><textarea id="pw" rows="4" cols="60" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"></textarea></p>
      <p class="fieldnote"><span id="count">0 characters</span></p>
    </section>

    <section class="tally">
      <p class="tallyhead">Clauses satisfied: <span id="score">0 of 1</span></p>
      <div class="bar" id="bar"><i id="fill"></i></div>
      <p class="status" id="taunt"></p>
    </section>

    <div id="win"></div>
    <ul class="notices" id="notices"></ul>

  </div>


</article>
</main>

function memeImg(k){
  var m = MEMES[k];
  if(!m) return "";
  return '<figure class="meme">' +
         '<img src="' + m.src + '" alt="' + esc(m.alt) + '" ' +
         'width="104" height="104" decoding="async" loading="lazy">' +
         '<figcaption>' + esc(m.credit) + '</figcaption></figure>';
}


var MONTHS = ["january","february","march","april","may","june","july",
  "august","september","october","november","december"];
var DAYS = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
var TODAY = DAYS[new Date().getDay()];
var SPONSORS = ["Glorp", "Nimbusware", "Tatertron"];

var MOONS = ["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"];
var MOON_NAMES = ["new moon","waxing crescent","first quarter","waxing gibbous",
  "full moon","waning gibbous","last quarter","waning crescent"];
function moonIndex(){
  var synodic = 29.530588853;
  var known = Date.UTC(2000, 0, 6, 18, 14) / 86400000;
  var age = ((Date.now() / 86400000 - known) % synodic + synodic) % synodic;
  return Math.floor(age / synodic * 8 + 0.5) % 8;
}
var MOON = MOONS[moonIndex()];

var CAPTCHA_POOL = "abcdefghijkmnpqrstuvwxyz";
function makeCaptcha(){
  var out = [], tilt = [];
  for(var i = 0; i < 5; i++){
    out.push(CAPTCHA_POOL[Math.floor(Math.random() * CAPTCHA_POOL.length)]);
    tilt.push(Math.round((Math.random() * 44 - 22)));
  }
  return {text: out.join(""), tilt: tilt};
}

    id: "len",

    id: "upper",

    text: "The atomic numbers of the chemical symbols in your password must add up to 200.",
    ok: function(v){ return atomicSum(v) === 200; },
    note: function(v){
      var found = elementsIn(v);
      if(!found.length) return "No symbols found. Total <b>0</b>.";
      return found.map(function(p){
        return "<b>" + p + "</b>&nbsp;" + EL[p];
      }).join(" + ") + " = <b>" + atomicSum(v) + "</b>.";
    },
    widget: function(){
      if(!state.hints.atomic){
        return '<button data-act="hint" data-id="atomic">Open the reference table</button>';
      }
      var rows = Object.keys(EL).sort(function(a, b){ return EL[a] - EL[b]; })
        .map(function(k){ return "<div><b>" + k + "</b> " + EL[k] + "</div>"; }).join("");
      return '<div class="table">' + rows + '</div>';
    }
  },
  {
    id: "fire",
    text: "Your password is on fire. Put it out.",
    ok: function(v){ return v.indexOf("🔥") === -1; },
    note: function(){ return "It is eating a character roughly every second."; }
  },
  {
    id: "prime",
    text: "The length of your password must be a prime number.",
    ok: function(v){ return isPrime(chars(v).length); },
    note: function(v){
      var n = chars(v).length;
      return "Length <b>" + n + "</b>. Nearest acceptable length above: <b>" +
             nextPrime(n + (isPrime(n) ? 1 : 0)) + "</b>.";
    }
  }
];

var FIRE_AT = RULES.findIndex(function(r){ return r.id === "fire"; });

var tauntEl = document.getElementById("taunt");

function taunt(){
  if(state.won) return "Determination filed. The form is yours to keep.";
  if(!state.started) return "Awaiting entry.";

  var secs = Math.floor((Date.now() - state.started) / 1000);
  var left = RULES.length - state.revealed;

  if(state.backs > 60) return "A great deal of deleting. The office does not mind.";
  if(state.edits > 500) return "Over 500 edits recorded against this form.";
  if(secs < 20)  return "Clause 1 is the generous one.";
  if(secs < 45)  return left > 0 ? left + " clauses are still sealed." : "Every clause is on the page now.";
  if(secs < 90)  return "The clauses get worse. That is the design.";
  if(secs < 150) return "Compliance takes time. The office has plenty.";
  if(secs < 240) return "Some clauses come with hints. Use them.";
  if(secs < 360) return "Still open. No penalty applies.";
  if(secs < 600) return "Filed under: persistent.";
  return "There is no time limit. Stop whenever you like.";
}

function paintTaunt(){
  if(!tauntEl) return;
  var secs = state.started ? Math.floor((Date.now() - state.started) / 1000) : 0;
  tauntEl.textContent = taunt();
  tauntEl.classList.toggle("hot", !state.won && (secs > 150 || state.backs > 60));
}

function ignite(){
  if(state.lit) return;
  state.lit = true;
  var arr = chars(pw.value);
  arr.splice(Math.floor(Math.random() * (arr.length + 1)), 0, "🔥");
  pw.value = arr.join("");
  state.timer = setInterval(burn, 1100);
}
function burn(){
  var arr = chars(pw.value);
  var i = arr.indexOf("🔥");
  if(i === -1 || state.won){
    clearInterval(state.timer);
    state.timer = null;
    return;
  }
  if(arr.length <= 1) return;
  var victim = (i + 1 < arr.length) ? i + 1 : i - 1;
  arr.splice(victim, 1);
  if(victim < i){
    var f = arr.indexOf("🔥");
    arr.splice(f, 1);
    arr.splice(Math.max(0, f - 1), 0, "🔥");
  }
  var caret = pw.selectionStart;
  pw.value = arr.join("");
  var end = pw.value.length;
  pw.setSelectionRange(Math.min(caret, end), Math.min(caret, end));
  render();
}

function render(){
  var v = pw.value;
  var results = RULES.map(function(r){ return r.ok(v); });

  var want = state.revealed;
  while(want < RULES.length && results.slice(0, want).every(Boolean)) want++;
  var grew = want > state.revealed;
  state.revealed = Math.max(state.revealed, want);

  if(state.revealed > FIRE_AT && !state.lit){
    ignite();
    render();
    return;
  }

  var shown = RULES.slice(0, state.revealed);
  var cleared = results.slice(0, state.revealed).filter(Boolean).length;

  document.getElementById("count").textContent =
    chars(v).length + (chars(v).length === 1 ? " character" : " characters");
  document.getElementById("edits").textContent = state.edits;
  document.getElementById("score").textContent =
    cleared + " of " + state.revealed;
  document.getElementById("fill").style.width =
    (cleared / RULES.length * 100).toFixed(1) + "%";
  document.getElementById("bar").classList.toggle("done", cleared === RULES.length);

  fieldEl.classList.toggle("burning", v.indexOf("🔥") !== -1);

  var failing = [], passing = [];
  shown.forEach(function(r, i){
    (results[i] ? passing : failing).push({rule: r, idx: i});
  });
  failing.reverse();
  passing.reverse();

  var html = failing.concat(passing).map(function(item){
    var r = item.rule, pass = results[item.idx];
    var fresh = (grew && item.idx === state.revealed - 1) ? " fresh" : "";
    var code = "Clause " + String(item.idx + 1).padStart(2, "0");
    var parts = ['<li class="rec ' + (pass ? "met" : "open") + fresh + '">'];
    parts.push('<p class="rec-head"><span class="code">' + code + '</span>' +
               '<span class="flag">' + (pass ? "Satisfied" : "Open") + '</span></p>');
    parts.push('<p class="rec-text">' + r.text + '</p>');
    if(!pass && r.note) parts.push('<p class="rec-note">' + r.note(v) + '</p>');
    if(!pass && r.widget) parts.push('<div class="rec-tray">' + r.widget() + '</div>');
    parts.push('</li>');
    return parts.join("");
  }).join("");

  noticesEl.innerHTML = html;

  state.lastLen = chars(v).length;
  paintTaunt();

  var done = state.revealed === RULES.length && results.every(Boolean);
  if(done && !state.won) celebrate(v);
}

function celebrate(v){
  state.won = true;
  if(state.timer) clearInterval(state.timer);
  paintTaunt();
  pw.readOnly = true;
  var secs = Math.round((Date.now() - state.started) / 1000);
  var mins = Math.floor(secs / 60);
  winEl.innerHTML =
    '<div class="win"><h2>Determination: accepted</h2>' +
    '<p>' + (mins ? mins + " min " : "") + (secs % 60) + ' s on the clock, ' +
    state.edits + ' edits, all ' + RULES.length +
    ' clauses satisfied.</p>' +
    '<div class="out">' + esc(v) + '</div>' +
    '<button data-act="again">Start a new form</button></div>';
  winEl.scrollIntoView({behavior: "smooth", block: "center"});
}

pw.addEventListener("input", function(){
  if(!state.started) state.started = Date.now();
  state.edits++;
  if(chars(pw.value).length < state.lastLen) state.backs++;
  render();
});

document.addEventListener("click", function(e){
  var btn = e.target.closest("button[data-act]");
  if(!btn) return;
  var act = btn.getAttribute("data-act");
  if(act === "recaptcha"){ state.captcha = makeCaptcha(); }
  if(act === "hint"){ state.hints[btn.getAttribute("data-id")] = true; }
  if(act === "again"){ location.reload(); return; }
  render();
});

setInterval(function(){
  if(!state.started || state.won) return;
  paintTaunt();
  var secs = Math.floor((Date.now() - state.started) / 1000);
  document.getElementById("clock").textContent =
    String(Math.floor(secs / 60)).padStart(2, "0") + ":" +
    String(secs % 60).padStart(2, "0");
}, 500);

render();
pw.focus();
})();
</script>
</body>
</html>
